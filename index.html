<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studienbuch</title>
<meta name="description" content="Studienbuch: Lernen, Kalender und Erfassen für das Studium Soziale Arbeit, FOM">
<meta name="theme-color" content="#13294B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
// Hell oder dunkel vor dem ersten Zeichnen setzen (kein Aufblitzen)
(function(){ var t=null; try{ t=JSON.parse(localStorage.getItem("kt2.local")||"{}").theme; }catch(e){}
  if(t!=="light" && t!=="dark") t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Figtree:wght@400;500;600;700&display=swap">
<!-- Versionszusatz ?v= bei jeder neuen Version erhöhen (gleicher Wert in sw.js), damit nie alte und neue Dateien gemischt laufen -->
<link rel="stylesheet" href="css/basis.css?v=1.6.1">
<link rel="stylesheet" href="css/lernen.css?v=1.6.1">
<link rel="stylesheet" href="css/studienbuch.css?v=1.6.1">
</head>
<body>
<div class="shell">
  <!-- Seitenleiste am PC (ab 960 px Breite) -->
  <aside class="side" aria-label="Studienbuch">
    <span class="brand">Studienbuch</span>
    <button class="capBtn" type="button" data-cap><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Erfassen</button>
    <nav class="sidenav" aria-label="Bereiche">
      <button type="button" data-v="heute" data-area="heute"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg>Heute</button>
      <button type="button" data-v="kalender" data-area="kalender"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Kalender</button>
      <button type="button" data-v="home" data-area="lernen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4v16H5zM10 4h4v16h-4zM15.5 5l3.8-1 3 15.4-3.8 1z"/></svg>Lernen</button>
      <button type="button" data-v="stats" data-area="statistik"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg>Statistik</button>
    </nav>
    <div class="sidefoot">
      <button class="pill syncpill" type="button" data-s="off"><i aria-hidden="true"></i><span>…</span></button>
      <div class="sidetools">
        <button class="iconBtn themeBtn" type="button"><i class="ico" aria-hidden="true"></i><span class="sr">Dunkel</span></button>
        <button class="sidelink" type="button" data-v="data" data-area="einstellungen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Einstellungen</button>
      </div>
      <span class="tiny sidever" data-ver></span>
    </div>
  </aside>

  <div class="col">
    <!-- Kopf am Handy und Tablet -->
    <header class="hdr" id="hdr">
      <div class="bar">
        <span class="brand">Studienbuch</span>
        <span class="hdate" id="hdate"></span>
        <span class="sp"></span>
        <button class="pill syncpill" id="syncPill" type="button" data-s="off"><i aria-hidden="true"></i><span>…</span></button>
        <button class="iconBtn themeBtn" id="themeBtn" type="button"><i class="ico" aria-hidden="true"></i><span class="sr">Dunkel</span></button>
        <button class="iconBtn" type="button" data-v="data" data-area="einstellungen" aria-label="Einstellungen" title="Einstellungen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>
    </header>
    <!-- Unterreiter im Bereich Lernen (der bisherige Klausurtrainer) -->
    <nav class="subnav" id="subnav" aria-label="Lernen" hidden>
      <button type="button" data-v="home">Übersicht</button>
      <button type="button" data-v="train">Training</button>
      <button type="button" data-v="errors">Fehler</button>
      <button type="button" data-v="sim">Simulation</button>
      <button type="button" data-v="transfer">Transfer</button>
      <button type="button" data-v="catalog">Katalog</button>
    </nav>
    <main id="main"></main>
  </div>
</div>

<!-- Leiste unten am Handy und Tablet (Lastenheft H1) -->
<nav class="tabbar" id="tabbar" aria-label="Hauptnavigation">
  <button type="button" data-v="heute" data-area="heute"><span class="tbar" aria-hidden="true"></span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg>Heute</button>
  <button type="button" data-v="kalender" data-area="kalender"><span class="tbar" aria-hidden="true"></span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Kalender</button>
  <div class="fabwrap"><button class="fab" type="button" data-cap aria-label="Erfassen" title="Erfassen"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <button type="button" data-v="home" data-area="lernen"><span class="tbar" aria-hidden="true"></span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4v16H5zM10 4h4v16h-4zM15.5 5l3.8-1 3 15.4-3.8 1z"/></svg>Lernen</button>
  <button type="button" data-v="stats" data-area="statistik"><span class="tbar" aria-hidden="true"></span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg>Statistik</button>
</nav>

<!-- Fenster von unten: Erfassen (Lastenheft H3, H4, ab 1.5.0) -->
<div class="sheetBack" id="sheet" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <span class="grip" aria-hidden="true"></span>
    <div class="sheetHead"><h2 id="sheetTitle">Erfassen</h2>
      <button class="iconBtn plain" type="button" id="sheetClose" aria-label="Schließen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <!-- „Vorlesung läuft“ (ab 1.6.0 aus dem Kalender) -->
    <div class="capHint" id="capHint" hidden></div>
    <fieldset class="capField"><legend class="kicker">Modul</legend>
      <div class="capMods" id="capMods"></div>
      <span class="small muted capInfo" id="capInfo"></span></fieldset>
    <div class="capOpts">
      <button type="button" class="capOpt main" id="capFoto"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Foto</span></button>
      <button type="button" class="capOpt" id="capDatei"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg><span>Datei</span></button>
      <button type="button" class="capOpt" id="capNotiz"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19l1-4L16 5l3 3L9 18z"/><path d="M14 7l3 3"/></svg><span>Notiz</span></button>
    </div>
    <div class="capRow" id="capEntwurf" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span></span><a href="#" id="capEntwurfGo">Fortsetzen</a></div>
    <div class="capRow" id="capQueue" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5M8 9l4-4 4 4"/><path d="M5 19h14"/></svg><span></span><a href="#" id="capQueueGo">Anzeigen</a></div>
    <div class="capList" id="capList" hidden></div>
  </section>
</div>

<input type="file" id="camIn" accept="image/*" capture="environment" multiple hidden>
<input type="file" id="fileIn" multiple hidden>
<input type="file" id="dirInput" webkitdirectory directory multiple hidden>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/basis.js?v=1.6.1"></script>
<script src="js/lernlogik.js?v=1.6.1"></script>
<script src="js/drive.js?v=1.6.1"></script>
<script src="js/lernen.js?v=1.6.1"></script>
<script src="js/heute.js?v=1.6.1"></script>
<script src="js/zeit.js?v=1.6.1"></script>
<script src="js/statistik.js?v=1.6.1"></script>
<script src="js/kalender.js?v=1.6.1"></script>
<script src="js/erfassen.js?v=1.6.1"></script>
<script src="js/app.js?v=1.6.1"></script>
</body>
</html>
