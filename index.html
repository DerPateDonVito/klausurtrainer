<style>
:root{
  --bg:#F3F4F7;--surf:#FFFFFF;--text:#1A2030;--muted:#5E6779;--rule:#DEE2E9;--line:#ECEFF3;
  --m1:#2E8478;--m2:#A86F1C;--m3:#6B57B0;--red:#B4403A;--redSoft:#FBEDEB;--good:#2F7A4E;--goodSoft:#E7F2EB;
  --p1:#B8615A;--p2:#C38A4E;--p3:#B9A34E;--p4:#7E9E62;--p5:#4E8C78;--p6:#46708C;
  --f:"Lexend","Segoe UI",Roboto,Arial,sans-serif; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#151A24;--surf:#1D2431;--text:#E9EDF4;--muted:#9AA5B8;--rule:#2B3445;--line:#252D3B;
  --m1:#5FB3A8;--m2:#D9A75B;--m3:#A493D6;--red:#E58C86;--redSoft:#352326;--good:#7CC49A;--goodSoft:#1E3127;
  --p1:#D08A83;--p2:#D7A46F;--p3:#CDBD72;--p4:#9DBA83;--p5:#79B39F;--p6:#7FA2BD; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:300 16px/1.6 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
b,strong{font-weight:500}
a{color:inherit}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.mono{font-variant-numeric:tabular-nums}

/* Kopf */
.hdr{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--rule)}
.bar{max-width:1040px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-left)) 4px;display:flex;align-items:center;gap:10px}
.brand{font-weight:500;margin-right:auto;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:4px 11px 4px 6px;font:400 .78rem/1.2 var(--f);color:var(--muted);background:var(--surf);cursor:pointer;max-width:58vw}
.pill i{flex:0 0 18px;height:18px;border-radius:50%;background:var(--text);display:grid;place-items:center;color:var(--surf);font-style:normal;font-size:10px}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill[data-s="ok"] i{background:var(--good)} .pill[data-s="busy"] i{background:var(--p6)}
.pill[data-s="auth"] i,.pill[data-s="err"] i{background:var(--red)} .pill[data-s="off"] i{background:var(--muted)}
nav{max-width:1040px;margin:0 auto;padding:0 max(10px,env(safe-area-inset-left));display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;padding:9px 9px 8px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-size:.92rem}
nav button[aria-current="page"]{color:var(--text);border-bottom-color:var(--text);font-weight:500}
main{max-width:1040px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) 90px}
h1{font:500 1.5rem/1.25 var(--f);margin:0 0 6px}
h2{font:500 1.12rem/1.3 var(--f);margin:28px 0 10px}
h3{font:500 1rem/1.3 var(--f);margin:0 0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.hint{font-size:.85rem;color:var(--muted);max-width:70ch}

/* Bedienelemente */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--text);background:var(--text);color:var(--surf);padding:10px 18px;border-radius:12px;cursor:pointer;font-weight:500;text-decoration:none}
.btn.ghost{background:var(--surf);color:var(--text);border-color:var(--rule)}
.btn.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 4px;font-weight:400}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.small{padding:6px 12px;font-size:.85rem;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--surf);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{border-color:var(--text);background:var(--text);color:var(--surf)}
label.field{display:block;margin:10px 0}
label.field>span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--rule);background:var(--surf);border-radius:12px;padding:10px 12px}
textarea{min-height:150px;resize:vertical;line-height:1.6}
.card{background:var(--surf);border-radius:16px;padding:16px;margin:0 0 14px}
.note{border-left:3px solid var(--p6);background:var(--surf);padding:10px 14px;border-radius:0 12px 12px 0;margin:10px 0;font-size:.9rem}
.warn{border-left:3px solid var(--red);background:var(--redSoft);padding:10px 14px;border-radius:0 12px 12px 0;margin:10px 0;font-size:.9rem}
.okbox{border-left:3px solid var(--good);background:var(--goodSoft);padding:10px 14px;border-radius:0 12px 12px 0;margin:10px 0;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--surf);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t td,table.t th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top;font-weight:400}
table.t th{color:var(--muted)}
details summary{cursor:pointer;font-size:.9rem;margin:6px 0}
.st{display:inline-block;min-width:1.5em;text-align:center;font:500 .72rem/1.6 var(--f);border-radius:5px;padding:0 5px;border:1px solid var(--rule);color:var(--muted)}
.st.A,.st.B{color:var(--text);border-color:var(--text)}
.st.X{color:var(--red);border-color:var(--red)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mc,var(--muted))}

/* Übersicht */
.mods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
@media(max-width:860px){.mods{grid-template-columns:1fr}}
.mod{background:var(--surf);border-radius:16px;padding:16px;border-top:3px solid var(--mc)}
.mod .n{font-size:.85rem;color:var(--muted)}
.days{font:500 2.2rem/1 var(--f);margin:10px 0 2px;color:var(--mc)}
.stack{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;align-items:end;height:44px;margin-top:14px}
.stack i{display:block;border-radius:3px 3px 0 0;min-height:2px}
.lbl{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font-size:.7rem;color:var(--muted);text-align:center;margin-top:3px}
.facts{display:flex;gap:6px 14px;flex-wrap:wrap;margin:10px 0 0;font-size:.82rem;color:var(--muted)}
.facts b{color:var(--text)}
.unl{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:.85rem}

/* Training */
.tr{max-width:760px;margin:0 auto}
.ttop{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted);margin-bottom:8px}
.ttop .m{display:flex;align-items:center;gap:6px;color:var(--text);font-weight:400}
.faecher{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.faecher span{height:6px;border-radius:3px;opacity:.3}
.faecher span.cur{opacity:1;height:8px;margin-top:-1px}
.fl{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);margin:2px 0 14px}
.q{font:500 1.35rem/1.4 var(--f);margin:0 0 6px;text-wrap:pretty}
.qmeta{font-size:.8rem;color:var(--muted);margin-bottom:14px}
.korr{margin-top:18px;border-left:2px solid var(--red);padding-left:14px}
.korr h3{font-size:.85rem;color:var(--muted);font-weight:400}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer;font-size:.95rem}
.check input{position:absolute;opacity:0;pointer-events:none}
.tick{flex:0 0 20px;height:20px;border:1.5px solid var(--rule);border-radius:5px;display:grid;place-items:center;color:transparent;font:600 12px/1 var(--f);margin-top:3px}
.check input:checked + .tick{border-color:var(--red);color:var(--red)}
.check input:focus-visible + .tick{outline:2px solid var(--text);outline-offset:2px}
.box{font-size:.92rem;background:var(--surf);border-radius:12px;padding:12px 14px;margin-top:10px}
.box h3{font-size:.85rem;margin-bottom:4px}
.box p{white-space:pre-wrap;margin:0}
.box.err{background:var(--redSoft)} .box.err h3{color:var(--red)}
.box.mine{border:1px solid var(--rule);background:transparent}
.grades{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
.grades button{border:1px solid var(--rule);background:var(--surf);border-radius:14px;padding:13px 4px;font-weight:500;cursor:pointer;line-height:1.25}
.grades button small{display:block;font:300 .7rem/1.3 var(--f);color:var(--muted)}
.grades .f{color:var(--red)} .grades .r{color:var(--good)}
.grades button.sugg{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.gh{font-size:.75rem;color:var(--muted);text-align:center;margin-top:6px}
.wb{max-width:100%;border-radius:10px;margin-top:8px;background:#fff}
.syncwarn{font-size:.8rem}

/* Liste */
.list{border-top:1px solid var(--rule)}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;padding:10px 2px;border-bottom:1px solid var(--rule);align-items:baseline;cursor:pointer}
.li:hover{background:var(--surf)}
.li .s{font-size:.78rem;color:var(--muted);white-space:nowrap}
.li .why{grid-column:2/4;font-size:.8rem;color:var(--muted)}

/* Simulation */
.timer{position:sticky;top:86px;z-index:5;background:var(--surf);border-radius:12px;padding:8px 14px;display:flex;gap:12px;align-items:center;margin-bottom:14px;box-shadow:0 1px 0 var(--rule)}
.timer b{font:500 1.3rem/1 var(--f)}
.timer.over b{color:var(--red)}
.simq{background:var(--surf);border-radius:16px;padding:16px;margin:0 0 14px}
.simq textarea{background:var(--bg)}
.ptsin{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* Statistik */
.bars{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:90px;margin-top:10px}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;width:100%}
.bl{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font-size:.62rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: no-preference){ .reveal{animation:rv .18s ease-out} @keyframes rv{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}} }
</style>
</head>

<script>
"use strict";
/* ============================================================
   Konfiguration
   ============================================================ */
const VERSION = "1.0 (14.10.2026)";
const SCOPE = "https://www.googleapis.com/auth/drive.file";
const DRIVE = "https://www.googleapis.com/drive/v3";
const UPLOAD = "https://www.googleapis.com/upload/drive/v3";
const FOLDER_NAME = "Klausurtrainer";
const MODULES = {
  M2:{name:"Aufbau des Sozialsystems und Sozialpolitik", short:"Sozialsystem", doz:"Boroch", exam:"2027-01-14", color:"var(--m2)",
      rule:"Freitext, keine MC. Systeme grafisch und schriftlich. 90 Punkte, bestanden ab 45."},

  M1:{name:"Grundlagen der Sozialen Arbeit", short:"Grundlagen", doz:"Thiele", exam:"2027-01-28", color:"var(--m1)",
      rule:"Überwiegend freie Fragen. Klausur wie die Übungsblätter. Zusammenhang vor Definition."}
};
const STATUS = {
  A:{label:"Offiziell", long:"Vom Dozenten als Übungs- oder Klausurfrage ausgegeben"},
  B:{label:"Betont", long:"Vom Dozenten angekündigt oder klar betont"},

  X:{label:"Ausgeschlossen", long:"Vom Dozenten ausdrücklich ausgeschlossen"},
  "?":{label:"Unbewertet", long:"Karte ohne Eintrag in der Prüfungsebene"}
};
const RICHTZEIT = {Nennen:3, Definition:4, Erklären:6, Verständnis:6, Vergleichen:6, Vergleich:6, Zeichnen:8, Fall:10, Transfer:10};
// Lastenheft B4: 6 Fächer, Abstände 1-3-7-14-30 Tage. Fach 1 und 2: nächster Tag.
const IVL = {1:1, 2:1, 3:3, 4:7, 5:14, 6:30};
const CYCLE = 25; // Tage von Fach 1 bis Fach 6 bei durchgehend „richtig“
const TRANSFER_DEFAULT = {
  M3:{title:"Theorie-Praxis-Transferaufgabe (Herberg)", punkte:15, known:true,
      task:"Recherchieren Sie in der Nähe Ihres Wohnortes ein Angebot der Sozialen Arbeit für Kinder, Jugendliche oder Familien (SGB VIII §§ 16-21, §§ 22-26, §§ 27-41) und beschreiben Sie es kurz.",
      source:"Skript S. 196, dazu S. 167 und 194. Herberg: 15 Punkte, vorab bekannt, gleiche Aufgabe in der Klausur (V1 2:37:55).",
      points:["Name des Angebots","Art des Angebots","Rechtliche Verortung im SGB VIII","Zielsetzung des Angebots","Arbeitsprinzipien (wie wird gearbeitet?)","Besondere Methoden und Techniken"]},
  M2:{title:"Transferaufgabe Träger des Sozialen (Boroch)", punkte:12, known:false,
      task:"Noch nicht ausgegeben. Thema laut Skript Teil 2, Folie 61: Kapitel 3.2 Träger des Sozialen (Folien 61-79). Gliederung anpassen, sobald die Aufgabe vorliegt.",
      source:"Folie: 10 % = 9 Punkte, mündlich meistens 12 (V1 1:25:02-1:27:18). Gliederung unten ist vorläufig.",
      points:["Leistungsträger bzw. Kostenträger (Bund, Länder, Kommunen, Sozialversicherungen)","Leistungserbringer: öffentliche Träger","Leistungserbringer: frei-gemeinnützige Träger (Spitzenverbände der Wohlfahrtspflege)","Privat-gewerbliche Träger","Sozialrechtliches Dreiecksverhältnis","Einordnung des eigenen Arbeitgebers"]},
  M1:{title:"Transferaufgabe (Thiele)", punkte:9, known:false,
      task:"Inhalt noch unbekannt. Laut Modulbeschreibung ca. 10 % der Klausur. Ob die Aufgabe vorab bekannt gegeben wird, ist offen.",
      source:"Modulbeschreibung M1, Abschnitt Prüfung.", points:[]}
};
const K = "kt2.";
const DEVICE = /Android|iPhone|iPad/i.test(navigator.userAgent) ? "Handy" : "PC";

/* ============================================================
   Hilfsfunktionen
   ============================================================ */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let STORAGE_OK = true;
try{ localStorage.setItem(K+"probe","1"); localStorage.removeItem(K+"probe"); }catch(e){ STORAGE_OK = false; }
function lsGet(key, fb){ try{ const v = localStorage.getItem(K+key); return v ? JSON.parse(v) : fb; }catch(e){ return fb; } }
function lsSet(key, val){ try{ localStorage.setItem(K+key, JSON.stringify(val)); return true; }catch(e){ STORAGE_OK = false; toast("Speichern im Browser fehlgeschlagen: " + e.message); return false; } }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayNum(s){ const [y,m,d]=s.split("-").map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); }
function numDay(n){ return new Date(n*864e5).toISOString().slice(0,10); }
function fmtDate(s){ if(!s) return "–"; const [y,m,d]=s.slice(0,10).split("-"); return `${d}.${m}.${y}`; }
function fmtDT(iso){ if(!iso) return "–"; const d=new Date(iso); return d.toLocaleDateString("de-DE")+", "+d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}); }
function daysTo(s){ return dayNum(s) - dayNum(todayStr()); }
function num(x){ return String(Math.round(x*10)/10).replace(".", ","); }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 3600); }
function download(name, text, type="application/json"){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 500); }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0).toString(36); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function waitFor(cond, ms){ return new Promise((res,rej)=>{ const t0=Date.now(); (function loop(){ if(cond()) return res(); if(Date.now()-t0>ms) return rej(new Error("timeout")); setTimeout(loop,100); })(); }); }
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(_){} ta.remove(); return ok; }
}

function parseCSV(text, delim=";"){
  text = text.replace(/^﻿/, "");
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; continue; }
    if(c==='"' && f===""){ q=true; continue; }
    if(c===delim){ row.push(f); f=""; continue; }
    if(c==="\r") continue;
    if(c==="\n"){ row.push(f); rows.push(row); row=[]; f=""; continue; }
    f+=c;
  }
  if(f!=="" || row.length){ row.push(f); rows.push(row); }
  const clean = rows.filter(r => r.some(x => x.trim()!==""));
  if(!clean.length) return {head:[], rows:[], bad:[]};
  const head = clean[0].map(h=>h.trim());
  const out=[], bad=[];
  clean.slice(1).forEach((r,i)=>{
    if(r.length!==head.length) bad.push({line:i+2, cols:r.length, expected:head.length});
    const o={}; head.forEach((h,j)=>o[h]=(r[j]??"").trim()); out.push(o);
  });
  return {head, rows:out, bad};
}

/* ---------- IndexedDB für das Inhaltspaket (kann mehrere MB groß sein) ---------- */
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open("kt2",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbSet(k,v){ try{ const db=await idbOpen(); await new Promise((res,rej)=>{ const tx=db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); return true; }catch(e){ return false; } }
async function idbGet(k){ try{ const db=await idbOpen(); return await new Promise(res=>{ const r=db.transaction("kv").objectStore("kv").get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); }); }catch(e){ return null; } }

/* ============================================================
   Zustand
   ============================================================ */
let PROG  = lsGet("prog", {});      // Lernstand je Frage-ID: {f, due, hist:[{d,g,s}], lapses, unl, upd}
let TRANS = lsGet("trans", {});     // Transfer-Ausarbeitungen je Modul

let LOCAL = Object.assign({theme:null, cid:"", email:"", ids:{}, chg:0, synced:0, lastSync:null, lastBackup:0, pkgDriveTime:null, pkgErstellt:null}, lsGet("local", {}));
let DIFF  = lsGet("diff", null);
let PKG = null, ITEMS = [], BUILD = {warnings:[], cards:0, meta:0, files:[]};

// Client-ID: aus dem Einrichtungslink (#cid=…) oder vom Drive-Test übernehmen
(function(){
  const m = /[#&]cid=([^&]+)/.exec(location.hash);
  if(m){ LOCAL.cid = decodeURIComponent(m[1]).trim(); history.replaceState(null, "", location.pathname + location.search); }
  if(!LOCAL.cid){ try{ LOCAL.cid = (localStorage.getItem("kt-drive-cid")||"").trim(); }catch(e){} }

function persist(){ lsSet("prog",PROG); lsSet("trans",TRANS); lsSet("sims",SIMS); lsSet("set",SET); lsSet("local",LOCAL); }
function persistLocal(){ lsSet("local", LOCAL); }
function changed(opts={}){ LOCAL.chg++; persist(); renderSync(); scheduleSync(opts.unit ? 400 : 2500, opts); }
function pending(){ return LOCAL.chg > LOCAL.synced; }
function examOf(m){ return (SET.exams && SET.exams[m]) || MODULES[m].exam; }
function moduleOfId(id){ const m=/^(M\d)/.exec(id||""); return m ? m[1] : ""; }
function splitKern(s){ return (s||"").split("|").map(x=>x.trim()).filter(Boolean); }
function modOrder(){ return Object.keys(MODULES).sort((a,b)=>examOf(a).localeCompare(examOf(b))); }

/* ============================================================
   Fragen aus dem Inhaltspaket bauen
   ============================================================ */
function buildItems(cardFiles, metaFiles){
  const report = {cards:0, meta:0, warnings:[]};
  const cards = new Map();
  for(const cf of cardFiles){
    const p = parseCSV(cf.text);
    p.bad.forEach(b => report.warnings.push(`${cf.path}: Zeile ${b.line} hat ${b.cols} statt ${b.expected} Spalten`));
    if(p.rows.length && !("frage" in p.rows[0])){ report.warnings.push(`${cf.path}: Spalte frage fehlt, Datei übersprungen`); continue; }
    for(const r of p.rows){ if(!r.id) continue; if(cards.has(r.id)) report.warnings.push(`Karten-ID doppelt: ${r.id}`); cards.set(r.id, r); report.cards++; }
  }
  const metas = new Map();
  for(const mf of metaFiles){
    const p = parseCSV(mf.text);
    p.bad.forEach(b => report.warnings.push(`${mf.path}: Zeile ${b.line} hat ${b.cols} statt ${b.expected} Spalten`));
    for(const r of p.rows){ if(!r.id) continue; if(metas.has(r.id)) report.warnings.push(`Prüfungsebene: ID doppelt ${r.id}`); metas.set(r.id, r); report.meta++; }
  }
  const items = [];
  const mk = (id, c, m) => {
    c = c || {}; m = m || {};
    const status = (m.status || "?").toUpperCase();
    const it = {
      id, modul: (c.modul || moduleOfId(id)).toUpperCase(),
      thema: m.thema || c.thema || "", frage: m.frage || c.frage || "",
      antwort: m.antwort || c.antwort || "", mind: m.mindestantwort || "",
      kern: splitKern(m.kernelemente), fehler: m.typische_fehler || "",
      bild: m.bild || "", status: STATUS[status] ? status : "?",
      punkte: m.punkte ? Number(String(m.punkte).replace(",", ".")) || null : null,
      form: m.aufgabenform || c.typ || "", quelle: c.quelle || "", hinweis: c.dozentenhinweis || "",
      beleg: m.beleg || "", gueltig: (m.gueltig || "aktiv").toLowerCase(), karte: !!c.id
    };
    it.offen = !(it.antwort || it.mind);
    return it;
  };
  for(const [id,c] of cards) items.push(mk(id, c, metas.get(id)));
  for(const [id,m] of metas){
    if(cards.has(id)) continue;
    if(/^M\d-\d+$/.test(id)) report.warnings.push(`Prüfungsebene verweist auf Karte ${id}, die in karten.csv fehlt`);
    if(!m.frage){ report.warnings.push(`Prüfungsebene ${id}: weder Karte noch Frage vorhanden`); continue; }
    items.push(mk(id, null, m));
  }
  const known = items.filter(i=>MODULES[i.modul]);
  if(known.length < items.length) report.warnings.push(`${items.length-known.length} Frage(n) ohne Modul M1 bis M3 übersprungen`);
  known.sort((a,b)=> a.modul.localeCompare(b.modul) || a.id.localeCompare(b.id, "de", {numeric:true}));
  const unrated = known.filter(i=>i.status==="?").length;
  if(unrated) report.warnings.push(`${unrated} Karte(n) ohne Eintrag in der Prüfungsebene (Stufe unbewertet)`);
  return {items:known, report};
}
function itemHash(i){ return hashStr([i.frage,i.antwort,i.mind,i.kern.join("|"),i.fehler,i.status,i.gueltig,i.punkte].join("\u0001")); }

function applyPackage(pkg, isNew){
  const files = pkg.dateien || [];
  const cardFiles = files.filter(d => /(^|\/)karten\.csv$/i.test(d.path));
  const metaFiles = files.filter(d => /pruefung_M\d+\.csv$/i.test(d.path));
  const {items, report} = buildItems(cardFiles, metaFiles);
  if(isNew){
    const prev = lsGet("hashes", null), now = {};
    items.forEach(i => now[i.id] = itemHash(i));
    if(prev){
      const neu = items.filter(i => !(i.id in prev)).map(i=>i.id);
      const geaendert = items.filter(i => (i.id in prev) && prev[i.id]!==now[i.id]).map(i=>i.id);
      if(neu.length || geaendert.length){ DIFF = {at:pkg.erstellt, neu, geaendert, gesehen:false}; lsSet("diff", DIFF); }
    }
    lsSet("hashes", now);
    LOCAL.pkgErstellt = pkg.erstellt; persistLocal();
  }
  PKG = pkg; ITEMS = items;
  BUILD = {warnings:report.warnings.concat(pkg.hinweise||[]), cards:report.cards, meta:report.meta, files:files.map(f=>f.path)};
}

/* ============================================================
   Lernlogik (Lastenheft B)
   ============================================================ */
function prog(id){ return PROG[id] || null; }
function trainable(it){ return !it.offen && it.status!=="X" && it.gueltig!=="überholt" && it.gueltig!=="ueberholt"; }
function inScope(it){ return trainable(it) && SET.statuses.includes(it.status); }
function isDue(it){ const p=prog(it.id); return !!(p && p.due && dayNum(p.due) <= dayNum(todayStr())); }
function fachOf(it){ const p=prog(it.id); return p ? p.f : 0; }
function lastGrade(p){ return p && p.hist && p.hist.length ? p.hist.at(-1).g : null; }
function newAvail(m){
  const rank={A:0,B:1,C:2,"?":3};
  return ITEMS.filter(i => i.modul===m && inScope(i) && !prog(i.id))
    .sort((a,b)=> rank[a.status]-rank[b.status] || a.id.localeCompare(b.id,"de",{numeric:true}));
}
function unlockedToday(m){ const t=todayStr(); return ITEMS.filter(i=>i.modul===m && prog(i.id) && prog(i.id).unl===t).length; }
function recommendation(m){
  const avail = newAvail(m).length; if(!avail) return 0;
  const room = daysTo(examOf(m)) - 2 - CYCLE;
  const perDay = room > 0 ? Math.ceil(avail / room) : avail;
  return Math.max(0, Math.min(avail, perDay - unlockedToday(m)));
}
function unlock(m, n){
  const t = todayStr(), now = Date.now();
  const list = newAvail(m).slice(0, n);
  list.forEach(i => { PROG[i.id] = {f:1, due:t, hist:[], lapses:0, unl:t, upd:now}; });
  changed(); return list.length;
}
// Bewertung: g = "r" richtig, "t" teilweise, "f" falsch. Nur fällige Karten wechseln das Fach (Zusatzübung zählt nur in der Statistik).
function rate(it, g){
  const t = dayNum(todayStr());
  let p = PROG[it.id];
  if(!p){ p = {f:1, due:todayStr(), hist:[], lapses:0, unl:todayStr()}; }
  p = Object.assign({hist:[], lapses:0}, p);
  const scheduled = !p.hist.length || !p.due || dayNum(p.due) <= t;
  if(scheduled){
    if(g==="r") p.f = Math.min(6, p.f+1);
    else if(g==="f"){ p.f = Math.max(1, p.f-1); p.lapses++; }
    let due = t + IVL[p.f];
    const ex = dayNum(examOf(it.modul)) - 2;      // letzte Abfrage spätestens 2 Tage vor der Klausur
    if(ex > t && due > ex) due = ex;
    p.due = numDay(due);
  }
  p.hist = p.hist.concat({d:todayStr(), g, s:scheduled?1:0}).slice(-40);
  p.upd = Date.now();
  PROG[it.id] = p;
  changed();
  return scheduled;
}
function suggestGrade(checked, total){ if(!total) return null; if(checked===total) return "r"; if(checked*2 >= total) return "t"; return "f"; }

function hasToken(){ return !!G.token && Date.now() < G.exp; }
function gisReady(){ return !!(window.google && google.accounts && google.accounts.oauth2); }

async function onToken(r){

class AuthErr extends Error{ constructor(){ super("Anmeldung abgelaufen"); this.auth=true; } }
async function api(url, opt={}){
  if(!hasToken()) throw new AuthErr();
  let r;
  try{ r = await fetch(url, Object.assign({}, opt, {headers: Object.assign({Authorization:"Bearer "+G.token}, opt.headers||{})})); }
  catch(e){ const n = new Error("Keine Verbindung"); n.net = true; throw n; }
  if(r.status===401){ G.token=null; try{ sessionStorage.removeItem(K+"tok"); }catch(e){} throw new AuthErr(); }
  if(!r.ok){ const t = await r.text(); const e = new Error(`Drive ${r.status}: ${t.slice(0,200)}`); e.status = r.status; throw e; }
  return r;
}
const qs = s => encodeURIComponent(s);
async function findFolder(name, parent){
  let q = `name='${name}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
  if(parent) q += ` and '${parent}' in parents`;
  const r = await (await api(`${DRIVE}/files?q=${qs(q)}&orderBy=createdTime&fields=files(id,name)&spaces=drive`)).json();
  return r.files && r.files[0] ? r.files[0].id : null;
}
async function createFolder(name, parent){
  const body = {name, mimeType:"application/vnd.google-apps.folder"}; if(parent) body.parents=[parent];
  return (await (await api(`${DRIVE}/files?fields=id`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)})).json()).id;
}
async function checkId(id){ try{ const f = await (await api(`${DRIVE}/files/${id}?fields=id,trashed`)).json(); return !f.trashed; }catch(e){ if(e.auth || e.net) throw e; return false; } }
async function ensureFolder(){
  if(LOCAL.ids.folder && await checkId(LOCAL.ids.folder)) return LOCAL.ids.folder;
  LOCAL.ids = {};
  LOCAL.ids.folder = await findFolder(FOLDER_NAME) || await createFolder(FOLDER_NAME);
  persistLocal(); return LOCAL.ids.folder;
}
async function ensureBackupFolder(folder){
  if(LOCAL.ids.backup && await checkId(LOCAL.ids.backup)) return LOCAL.ids.backup;
  LOCAL.ids.backup = await findFolder("Sicherungen", folder) || await createFolder("Sicherungen", folder);
  persistLocal(); return LOCAL.ids.backup;
}
async function findFile(name, parent){
  const q = `name='${name}' and '${parent}' in parents and trashed=false`;
  const r = await (await api(`${DRIVE}/files?q=${qs(q)}&orderBy=modifiedTime desc&fields=files(id,name,modifiedTime,size)&spaces=drive`)).json();
  return r.files && r.files[0] || null;
}
async function readJSON(id){ return await (await api(`${DRIVE}/files/${id}?alt=media`)).json(); }
async function writeJSON(id, name, parent, obj){
  const body = JSON.stringify(obj);
  if(id){
    const r = await (await api(`${UPLOAD}/files/${id}?uploadType=media&fields=id,modifiedTime`, {method:"PATCH", headers:{"Content-Type":"application/json"}, body})).json();
    return r;
  }
  const fd = new FormData();
  fd.append("metadata", new Blob([JSON.stringify({name, parents:[parent], mimeType:"application/json"})], {type:"application/json"}));
  fd.append("file", new Blob([body], {type:"application/json"}));
  return await (await api(`${UPLOAD}/files?uploadType=multipart&fields=id,modifiedTime`, {method:"POST", body:fd})).json();
}

/* ---------- Abgleich (Lastenheft G3, G4) ---------- */
function stateObj(){ return {app:"Klausurtrainer", typ:"lernstand", version:2, geaendert:new Date().toISOString(), geraet:DEVICE, prog:PROG, transfer:TRANS, sims:SIMS, settings:SET}; }
function mergeIn(remote){
  let lc=false, rw=false;
  const rp = remote.prog || {};
  for(const id in rp){ const a=PROG[id], b=rp[id]; if(!a || (b.upd||0) > (a.upd||0)){ PROG[id]=b; lc=true; } else if((a.upd||0) > (b.upd||0)) rw=true; }
  for(const id in PROG) if(!(id in rp)) rw=true;
  const rt = remote.transfer || {};
  for(const m in rt){ const a=TRANS[m], b=rt[m]; if(!a || (b.upd||0) > (a.upd||0)){ TRANS[m]=b; lc=true; } else if((a.upd||0) > (b.upd||0)) rw=true; }
  for(const m in TRANS) if(!(m in rt)) rw=true;
  const rs = remote.sims || [], ids = new Set(SIMS.map(s=>s.id));
  for(const s of rs) if(!ids.has(s.id)){ SIMS.push(s); lc=true; }
  const rids = new Set(rs.map(s=>s.id)); if(SIMS.some(s=>!rids.has(s.id))) rw=true;
  if(lc) SIMS.sort((a,b)=> (a.d||"").localeCompare(b.d||""));
  const rset = remote.settings;
  if(rset && (rset.upd||0) > (SET.upd||0)){ SET = Object.assign({statuses:["A","B"], exams:{}}, rset); lc=true; }
  else if(!rset || (SET.upd||0) > (rset.upd||0)) rw=true;
  return {lc, rw};
}
let SYNCING=false, SYNC_AGAIN=null, SYNC_TIMER=null;
function scheduleSync(ms=2500, opts={}){ clearTimeout(SYNC_TIMER); SYNC_TIMER = setTimeout(()=>syncNow(opts), ms); }
async function syncNow(opts={}){
  if(!LOCAL.cid){ renderSync(); return; }
  if(!hasToken()){ renderSync(); return; }
  if(SYNCING){ SYNC_AGAIN = Object.assign(SYNC_AGAIN||{}, opts); return; }
  SYNCING = true; setSync("busy", "Abgleich …");
  const c0 = LOCAL.chg; let lc = false;
  try{
    const folder = await ensureFolder();
    let id = LOCAL.ids.lernstand || null, remote = null;
    if(id){ try{ remote = await readJSON(id); }catch(e){ if(e.auth || e.net) throw e; id = null; } }
    if(!id){ const f = await findFile("lernstand.json", folder); if(f){ id = f.id; remote = await readJSON(id); } }
    let res = {lc:false, rw:true};
    if(remote && remote.app==="Klausurtrainer") res = mergeIn(remote);
    lc = res.lc;
    if(lc) persist();
    if(res.rw || !remote){ const w = await writeJSON(id, "lernstand.json", folder, stateObj()); id = w.id || id; }
    LOCAL.ids.lernstand = id; LOCAL.synced = Math.max(LOCAL.synced, c0); LOCAL.lastSync = new Date().toISOString(); persistLocal();
    const gotPkg = await pullPackage(folder);
    if(opts.unit && Date.now() - (LOCAL.lastBackup||0) > 10*60e3) await backup(folder);
    setSync("ok", "Abgeglichen " + new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}));
    if(lc || gotPkg || opts.first) softRender();
  }catch(e){
    if(e.auth){ setSync("auth", "Anmeldung abgelaufen"); }
    else if(e.net){ setSync("off", "Offline, Abgleich später"); }
    else { setSync("err", "Abgleich fehlgeschlagen"); console.error(e); toast("Abgleich fehlgeschlagen: " + e.message); }
  }finally{
    SYNCING = false;
    if(SYNC_AGAIN){ const o = SYNC_AGAIN; SYNC_AGAIN = null; scheduleSync(800, o); }
    else if(LOCAL.chg > c0 && hasToken() && SYNC.s==="ok") scheduleSync(1500);
  }
}
async function pullPackage(folder){
  const f = await findFile("inhalte.json", folder);
  if(!f) return false;
  LOCAL.ids.inhalte = f.id;
  if(PKG && LOCAL.pkgDriveTime === f.modifiedTime){ persistLocal(); return false; }
  setSync("busy", "Neue Inhalte werden geladen …");
  const pkg = await readJSON(f.id);
  LOCAL.pkgDriveTime = f.modifiedTime; persistLocal();
  if(!pkg || pkg.app!=="Klausurtrainer" || pkg.typ!=="inhalte") return false;
  if(PKG && (pkg.erstellt||"") <= (PKG.erstellt||"")) return false;
  await idbSet("pkg", pkg);
  applyPackage(pkg, true);
  toast(`Neue Inhalte vom ${fmtDT(pkg.erstellt)} geladen: ${ITEMS.length} Fragen.`);
  return true;
}
async function backup(folder){
  const sub = await ensureBackupFolder(folder);
  const d = new Date(), p = n => String(n).padStart(2,"0");
  const name = `lernstand_${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}_${DEVICE}.json`;
  await writeJSON(null, name, sub, stateObj());
  LOCAL.lastBackup = Date.now(); persistLocal();
  const q = `'${sub}' in parents and trashed=false`;
  const list = (await (await api(`${DRIVE}/files?q=${qs(q)}&orderBy=createdTime desc&fields=files(id,name,createdTime)&pageSize=100`)).json()).files || [];
  for(const f of list.slice(10)){
    await api(`${DRIVE}/files/${f.id}`, {method:"PATCH", headers:{"Content-Type":"application/json"}, body:JSON.stringify({trashed:true})});
  }
}
async function listBackups(){
  const folder = await ensureFolder(); const sub = await ensureBackupFolder(folder);
  const q = `'${sub}' in parents and trashed=false`;
  return (await (await api(`${DRIVE}/files?q=${qs(q)}&orderBy=createdTime desc&fields=files(id,name,createdTime)&pageSize=20`)).json()).files || [];
}

/* ---------- Inhalte nach Drive (nur am PC, Lastenheft G7) ---------- */
async function shrinkImage(blob){
  try{
    const bmp = await createImageBitmap(blob);
    const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
    const x = c.getContext("2d"); x.fillStyle = "#ffffff"; x.fillRect(0,0,c.width,c.height); x.drawImage(bmp, 0, 0, c.width, c.height);
    let url = c.toDataURL("image/webp", 0.85);
    if(!url.startsWith("data:image/webp")) url = c.toDataURL("image/jpeg", 0.85);
    return url;
  }catch(e){ return null; }
}
async function collectFromHandle(root){
  const files = [];
  for await (const [name, h] of root.entries()){
    if(h.kind!=="directory" || !/^0[1-9]_/.test(name)) continue;
    try{ const f = await (await h.getFileHandle("karten.csv")).getFile(); files.push({path:`${name}/karten.csv`, text:await f.text()}); }catch(e){}
    try{
      const pd = await h.getDirectoryHandle("Pruefung");
      for await (const [fn, fh] of pd.entries()) if(fh.kind==="file" && /^pruefung_M\d+\.csv$/i.test(fn)) files.push({path:`${name}/Pruefung/${fn}`, text:await (await fh.getFile()).text()});
    }catch(e){}
  }
  const getBlob = async path => { try{ const parts = path.split("/"); let h = root; for(const p of parts.slice(0,-1)) h = await h.getDirectoryHandle(p); return await (await h.getFileHandle(parts.at(-1))).getFile(); }catch(e){ return null; } };
  return {files, getBlob, rootName: root.name};
}
async function collectFromList(list){
  const map = new Map(); let rootName = "";
  for(const f of list){ const parts = (f.webkitRelativePath || f.name).split("/"); rootName = parts[0]; map.set(parts.slice(1).join("/"), f); }
  const files = [];
  for(const [rel, f] of map){
    if(/^0[1-9]_[^/]+\/karten\.csv$/.test(rel) || /^0[1-9]_[^/]+\/Pruefung\/pruefung_M\d+\.csv$/i.test(rel)) files.push({path:rel, text:await f.text()});
  }
  return {files, getBlob: async p => map.get(p) || null, rootName};
}
async function buildAndUpload(src){
  const {files, getBlob, rootName} = src;
  if(!files.length){ toast("Keine karten.csv und keine Prüfungsdateien gefunden. Bitte den Ordner Studium bzw. Studium_Cloudkopie selbst wählen."); return; }
  setSync("busy", "Inhalte werden gepackt …");
  const {items} = buildItems(files.filter(f=>/karten\.csv$/i.test(f.path)), files.filter(f=>/pruefung_M\d+\.csv$/i.test(f.path)));
  const bilder = {}, hinweise = [];
  for(const it of items){
    if(!it.bild || bilder[it.bild]) continue;
    const blob = await getBlob(it.bild);
    if(!blob){ hinweise.push(`Bild nicht gefunden: ${it.bild}`); continue; }
    const url = await shrinkImage(blob);
    if(url) bilder[it.bild] = url; else hinweise.push(`Bild nicht lesbar: ${it.bild}`);
  }
  const pkg = {app:"Klausurtrainer", typ:"inhalte", version:1, erstellt:new Date().toISOString(), geraet:DEVICE, quelle:rootName, dateien:files, bilder, hinweise};
  try{
    const folder = await ensureFolder();
    let id = LOCAL.ids.inhalte && await checkId(LOCAL.ids.inhalte) ? LOCAL.ids.inhalte : null;
    if(!id){ const f = await findFile("inhalte.json", folder); id = f ? f.id : null; }
    setSync("busy", "Inhalte werden hochgeladen …");
    const w = await writeJSON(id, "inhalte.json", folder, pkg);
    LOCAL.ids.inhalte = w.id || id; LOCAL.pkgDriveTime = w.modifiedTime || null; persistLocal();
    await idbSet("pkg", pkg);
    applyPackage(pkg, true);
    setSync("ok", "Inhalte in Drive " + new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}));
    toast(`${ITEMS.length} Fragen und ${Object.keys(bilder).length} Bilder nach Drive gelegt.`);
    render();
  }catch(e){
    if(e.auth) setSync("auth","Anmeldung abgelaufen"); else if(e.net) setSync("off","Offline"); else setSync("err","Hochladen fehlgeschlagen");
    toast("Inhalte nicht hochgeladen: " + e.message);
  }
}

function moduleStats(m){
  const all = ITEMS.filter(i=>i.modul===m);
  const scope = all.filter(inScope);

  const fach = [0,0,0,0,0,0]; unl.forEach(i => fach[Math.min(6,Math.max(1,prog(i.id).f))-1]++);
  return {all, scope, unl, fach, due: unl.filter(isDue),
    gaps: all.filter(i=>["A","B"].includes(i.status) && i.offen && i.gueltig!=="überholt"),
    fresh: newAvail(m), errors: unl.filter(i=>lastGrade(prog(i.id))==="f")};
}

let SESSION = null;
function buildQueue(modul, limit){
  const pool = ITEMS.filter(i => inScope(i) && (modul==="ALL" || i.modul===modul) && isDue(i));
  pool.sort((a,b)=> prog(a.id).due.localeCompare(prog(b.id).due) || prog(a.id).f - prog(b.id).f || examOf(a.modul).localeCompare(examOf(b.modul)));
  return pool.slice(0, limit || pool.length).map(i=>i.id);
}
function viewTrain(opts={}){

    <div class="fl"><span>Fach ${f} von 6${scheduled?"":" · Zusatzübung, Fach bleibt"}</span><span>${esc(STATUS[it.status].label)} (${it.status})</span></div>

    ${it.form==="Zeichnen"?`<p class="hint">Erst auf Papier zeichnen, dann hier die Erläuterung schreiben.</p>`:""}

      <textarea id="answer" spellcheck="true" placeholder="${DEVICE==="PC"?"Schreiben, dann aufdecken. Strg+Enter deckt auf.":"Schreiben oder diktieren, dann aufdecken."}">${esc(draft)}</textarea></label>
    <div class="row" id="pre"><button class="btn" id="reveal">Aufdecken</button><button class="btn ghost" id="headOnly">Nur im Kopf beantwortet</button>${SESSION.single?"":`<button class="btn link" id="skip">Später</button>`}</div>
    <div id="post"></div></div>`;
  wireBanner();

    <button class="btn" id="rtOk" disabled>Fertig, weiter</button>`;
  const ta = $("#rt"), ok = $("#rtOk");

/* ---------- Klausursimulation (Lastenheft E1, E3; Dozentenmuster folgt im Pflichtenheft) ---------- */
let SIMRUN = lsGet("simrun", null);
function saveSimRun(){ lsSet("simrun", SIMRUN); }
function simPts(it){ return it.punkte || RICHTZEIT[it.form] || 6; }
function startSim(m, minutes){
  const D = TRANSFER_DEFAULT[m];
  const transfer = D && minutes >= 60 ? {m, pts:D.punkte} : null;
  let room = minutes - (transfer ? transfer.pts : 0);
  const pool = ITEMS.filter(i => i.modul===m && trainable(i) && ["A","B"].includes(i.status));
  const a = shuffle(pool.filter(i=>i.status==="A")), b = shuffle(pool.filter(i=>i.status==="B"));
  const pick = [];
  for(const it of a.concat(b)){ const p = simPts(it); if(p <= room){ pick.push({id:it.id, pts:p}); room -= p; } if(room < 3) break; }
  SIMRUN = {id:"s"+Date.now(), modul:m, minutes, start:Date.now(), items:pick, transfer, answers:{}, phase:"run", checks:{}, manual:{}};
  saveSimRun(); viewSim();
}
function viewSim(){
  stopClock();
  if(!ITEMS.length) return needsContent();
  if(!SIMRUN){
    const last = SIMS.slice(-8).reverse();
    main.innerHTML = `${syncBanner()}<h1>Klausursimulation</h1>
      <p class="hint">Vorläufige Fassung: Fragen der Stufen A und B, zufällig gemischt, 1 Punkt je Minute, bei 60 und 90 Minuten mit Transferaufgabe. Das genaue Muster je Dozent (Anteile, Punktwerte) folgt im Pflichtenheft. Die Simulation ändert keine Fächer.</p>
      <div class="card"><div class="chips" id="simM">${modOrder().map((m,i)=>`<button class="chip" data-m="${m}" aria-pressed="${i===0}">${m} ${esc(MODULES[m].short)}</button>`).join("")}</div>
        <div class="chips" id="simD" style="margin-top:10px">${[30,60,90].map(n=>`<button class="chip" data-d="${n}" aria-pressed="${n===90}">${n} Minuten</button>`).join("")}</div>
        <div class="row" style="margin-top:14px"><button class="btn" id="simGo">Simulation starten</button></div></div>
      ${last.length?`<h2>Bisherige Ergebnisse</h2><table class="t"><tr><th>Datum</th><th>Modul</th><th>Punkte</th><th>Anteil</th></tr>${last.map(s=>`<tr><td>${fmtDate(s.d)}</td><td>${s.modul}</td><td class="mono">${num(s.punkte)} von ${s.max}</td><td class="mono">${Math.round(s.punkte/s.max*100)} %</td></tr>`).join("")}</table>`:""}`;
    wireBanner();
    const sel = id => { const b=main.querySelector(`#${id} [aria-pressed="true"]`); return b ? (b.dataset.m || Number(b.dataset.d)) : null; };
    main.querySelectorAll("#simM .chip,#simD .chip").forEach(c => c.onclick = () => { c.parentElement.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed", x===c)); });
    $("#simGo").onclick = () => startSim(sel("simM"), sel("simD"));
    return;
  }
  const R = SIMRUN, M = MODULES[R.modul];
  const its = R.items.map(x => ({x, it:ITEMS.find(i=>i.id===x.id)})).filter(o=>o.it);
  const max = its.reduce((n,o)=>n+o.x.pts,0) + (R.transfer ? R.transfer.pts : 0);
  if(R.phase==="run"){
    main.innerHTML = `<div class="timer" id="tm"><span class="small muted">${R.modul} ${esc(M.short)} · ${max} Punkte</span><b class="mono" id="tmv" style="margin-left:auto">–</b></div>
      ${its.map((o,n)=>`<div class="simq"><div class="qmeta">Aufgabe ${n+1} · ${num(o.x.pts)} Punkte${o.it.form?` · ${esc(o.it.form)}`:""}</div><h3 style="font-size:1.1rem">${esc(o.it.frage)}</h3>
        <textarea data-a="${esc(o.it.id)}">${esc(R.answers[o.it.id]||"")}</textarea></div>`).join("")}
      ${R.transfer?`<div class="simq"><div class="qmeta">Transferaufgabe · ${R.transfer.pts} Punkte</div><h3 style="font-size:1.1rem">${esc(TRANSFER_DEFAULT[R.modul].task)}</h3><textarea data-a="_transfer" style="min-height:240px">${esc(R.answers._transfer||"")}</textarea></div>`:""}
      <div class="row"><button class="btn" id="simEnd">Abgeben</button><button class="btn link" id="simAbort">Abbrechen</button></div>`;
    const tick = () => { const left = R.start + R.minutes*60e3 - Date.now(), s = Math.round(Math.abs(left)/1000);
      $("#tmv").textContent = (left<0?"+":"") + `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; $("#tm").classList.toggle("over", left<0); };
    tick(); CLOCK = setInterval(tick, 1000);
    main.querySelectorAll("textarea[data-a]").forEach(t => t.oninput = () => { R.answers[t.dataset.a] = t.value; saveSimRun(); });
    $("#simEnd").onclick = () => { R.phase="korr"; R.used = Math.round((Date.now()-R.start)/60e3); saveSimRun(); window.scrollTo(0,0); viewSim(); };
    $("#simAbort").onclick = () => { if(confirm("Simulation abbrechen? Die Antworten werden verworfen.")){ SIMRUN=null; saveSimRun(); viewSim(); } };
    return;
  }
  // Korrektur
  const T = R.transfer ? tget(R.modul) : null;
  const score = () => {
    let sum = 0;
    for(const o of its){ const k = o.it.kern.length;
      if(k){ const c = (R.checks[o.it.id]||[]).length; sum += Math.round(c/k*o.x.pts*2)/2; }
      else sum += (R.manual[o.it.id]||0) * o.x.pts; }
    if(R.transfer && T.points.length){ const c=(R.checks._transfer||[]).length; sum += Math.round(c/T.points.length*R.transfer.pts*2)/2; }
    return sum;
  };
  main.innerHTML = `<h1>Korrektur</h1><p class="hint">Hake ab, was in deiner Antwort steht. Die Punkte sind eine Schätzung: Anteil der Kernelemente mal Punktwert.${R.used?` Bearbeitungszeit: ${R.used} von ${R.minutes} Minuten.`:""}</p>
    ${its.map((o,n)=>`<div class="simq"><div class="qmeta">Aufgabe ${n+1} · ${num(o.x.pts)} Punkte</div><h3>${esc(o.it.frage)}</h3>
      <div class="box mine"><h3>Deine Antwort</h3><p>${esc(R.answers[o.it.id]||"(leer)")}</p></div>
      ${o.it.kern.length?`<div class="korr">${o.it.kern.map((k,i)=>`<label class="check"><input type="checkbox" data-q="${esc(o.it.id)}" data-i="${i}" ${(R.checks[o.it.id]||[]).includes(i)?"checked":""}><span class="tick">✓</span><span>${esc(k)}</span></label>`).join("")}</div>`
        :`<div class="ptsin">${[[0,"0"],[0.5,"halb"],[1,"voll"]].map(([v,l])=>`<button class="chip" data-man="${esc(o.it.id)}" data-v="${v}" aria-pressed="${(R.manual[o.it.id]||0)===v}">${l}</button>`).join("")}</div>`}
      ${o.it.mind?`<div class="box"><h3>Mindestantwort</h3><p>${esc(o.it.mind)}</p></div>`:""}
      ${o.it.antwort?`<details><summary>${o.it.mind?"Vollantwort":"Musterantwort"}</summary><div class="box"><p>${esc(o.it.antwort)}</p></div></details>`:""}</div>`).join("")}
    ${R.transfer?`<div class="simq"><div class="qmeta">Transferaufgabe · ${R.transfer.pts} Punkte</div><div class="box mine"><h3>Deine Antwort</h3><p>${esc(R.answers._transfer||"(leer)")}</p></div>
      ${T.points.length?`<div class="korr"><h3>Gliederungspunkte getroffen?</h3>${T.points.map((p,i)=>`<label class="check"><input type="checkbox" data-q="_transfer" data-i="${i}" ${(R.checks._transfer||[]).includes(i)?"checked":""}><span class="tick">✓</span><span>${esc(p)}</span></label>`).join("")}</div>`:`<p class="hint">Für diese Transferaufgabe gibt es noch keine Gliederung.</p>`}</div>`:""}
    <div class="timer"><span>Geschätzt</span><b class="mono" id="sc" style="margin-left:auto">–</b></div>
    <div class="row"><button class="btn" id="simSave">Ergebnis speichern</button></div>`;
  const upd = () => { const s = score(); $("#sc").textContent = `${num(s)} von ${max} P. (${Math.round(s/max*100)} %)`; };
  main.querySelectorAll("input[data-q]").forEach(c => c.onchange = () => { const q=c.dataset.q, i=Number(c.dataset.i); const a=new Set(R.checks[q]||[]); c.checked?a.add(i):a.delete(i); R.checks[q]=[...a]; saveSimRun(); upd(); });
  main.querySelectorAll("[data-man]").forEach(b => b.onclick = () => { R.manual[b.dataset.man]=Number(b.dataset.v); main.querySelectorAll(`[data-man="${CSS.escape(b.dataset.man)}"]`).forEach(x=>x.setAttribute("aria-pressed", x===b)); saveSimRun(); upd(); });
  upd();
  $("#simSave").onclick = () => { const s=score(); SIMS.push({id:R.id, d:todayStr(), modul:R.modul, punkte:s, max, minuten:R.minutes, upd:Date.now()}); SIMRUN=null; saveSimRun(); changed({unit:true}); toast(`Gespeichert: ${num(s)} von ${max} Punkten.`); viewSim(); };
}

/* ---------- Transferaufgaben ---------- */
let TMODE = {};
function tget(m){ const d = TRANSFER_DEFAULT[m]; const t = TRANS[m] || {}; return {points: t.points || d.points.slice(), texts: t.texts || {}, hist: t.hist || []}; }
function tsave(m, t, unit){ TRANS[m] = Object.assign({}, TRANS[m]||{}, t, {upd:Date.now()}); changed({unit}); }
function viewTransfer(){
  const order = modOrder();
  let html = `${syncBanner()}<h1>Transferwerkstatt</h1><p class="hint">Ausarbeitung einmal sauber schreiben, dann unter Zeitvorgabe aus dem Kopf wiedergeben und vergleichen. Die Transferaufgaben in M2 und M3 bringen zusammen 21 bis 27 nahezu sichere Punkte.</p>`;
  for(const m of order){
    const D = TRANSFER_DEFAULT[m], t = tget(m), mode = TMODE[m] || "view";
    const filled = t.points.filter(p => (t.texts[p]||"").trim()).length, last = t.hist.at(-1);
    html += `<section class="card" id="tr-${m}" style="border-top:3px solid ${MODULES[m].color}"><h3>${m}: ${esc(D.title)}</h3><p class="small muted">${D.punkte} Punkte${m==="M2"?" (9 bis 12)":""}</p>
      <p>${esc(D.task)}</p><p class="small muted">${esc(D.source)}</p>
      <div class="facts"><span>Ausgearbeitet: <b class="fill">${filled} von ${t.points.length}</b></span><span>Zuletzt geübt: <b>${last?`${fmtDate(last.d)}, ${last.p} %`:"noch nie"}</b></span></div>
      <div class="row" style="margin-top:10px">
        <button class="btn small ${mode==="edit"?"":"ghost"}" data-m="${m}" data-mode="edit">Ausarbeitung bearbeiten</button>
        <button class="btn small ${mode==="drill"?"":"ghost"}" data-m="${m}" data-mode="drill" ${filled?"":"disabled"}>Aus dem Kopf üben</button>
        <button class="btn small ghost" data-m="${m}" data-mode="outline">Gliederung ändern</button>
        <button class="btn link" data-m="${m}" data-mode="md" ${filled?"":"disabled"}>Als Text speichern</button>
      </div><div class="tbody"></div></section>`;
  }
  main.innerHTML = html; wireBanner();
  main.querySelectorAll("button[data-mode]").forEach(b => b.onclick = () => {
    const m=b.dataset.m, md=b.dataset.mode;
    if(md==="md"){ const t=tget(m); download(`Transfer_${m}.md`, `# ${TRANSFER_DEFAULT[m].title}\n\n`+t.points.map(p=>`## ${p}\n\n${t.texts[p]||""}\n`).join("\n"), "text/markdown"); return; }
    TMODE[m] = TMODE[m]===md ? "view" : md; viewTransfer(); $("#tr-"+m).scrollIntoView({block:"start"});
  });
  for(const m of order){
    const box = $(`#tr-${m} .tbody`), t = tget(m), mode = TMODE[m], D = TRANSFER_DEFAULT[m];
    if(mode==="edit"){
      if(!t.points.length){ box.innerHTML = `<p class="hint" style="margin-top:12px">Noch keine Gliederung. Erst über „Gliederung ändern“ die Punkte anlegen.</p>`; continue; }
      box.innerHTML = t.points.map((p,i)=>`<div style="margin-top:14px"><h3>${esc(p)}</h3><textarea data-p="${i}" style="min-height:100px" aria-label="${esc(p)}">${esc(t.texts[p]||"")}</textarea></div>`).join("") + `<p class="hint">Wird beim Tippen gespeichert und abgeglichen.</p>`;
      box.querySelectorAll("textarea").forEach(ta => ta.oninput = () => { const tt=tget(m); tt.texts[tt.points[ta.dataset.p]] = ta.value; tsave(m, {texts:tt.texts, points:tt.points});
        const n = tt.points.filter(p => (tt.texts[p]||"").trim()).length; $(`#tr-${m} .fill`).textContent = `${n} von ${tt.points.length}`;
        $(`#tr-${m}`).querySelectorAll('[data-mode="drill"],[data-mode="md"]').forEach(b => b.disabled = !n); });
    }else if(mode==="outline"){
      box.innerHTML = `<label class="field"><span>Ein Gliederungspunkt pro Zeile</span><textarea id="ol-${m}">${esc(t.points.join("\n"))}</textarea></label><button class="btn" id="olSave-${m}">Gliederung übernehmen</button>`;
      $(`#olSave-${m}`).onclick = () => { const pts=$(`#ol-${m}`).value.split("\n").map(s=>s.trim()).filter(Boolean); tsave(m, {points:pts, texts:tget(m).texts}); TMODE[m]="edit"; viewTransfer(); toast("Gliederung übernommen."); };
    }else if(mode==="drill"){
      box.innerHTML = `<div class="timer" style="margin-top:12px"><span>Zeitvorgabe ${D.punkte} Minuten</span><b class="mono" id="tclk-${m}" style="margin-left:auto">0:00</b></div>` +
        t.points.map((p,i)=>`<div style="margin-top:14px"><h3>${esc(p)}</h3><textarea data-p="${i}" style="min-height:90px" aria-label="${esc(p)}"></textarea><div class="cmp" hidden></div></div>`).join("") +
        `<button class="btn" id="tcheck-${m}" style="margin-top:12px">Mit Ausarbeitung vergleichen</button><div id="tres-${m}"></div>`;
      const st=Date.now(), el=$(`#tclk-${m}`);
      stopClock(); CLOCK = setInterval(()=>{ const s=Math.floor((Date.now()-st)/1000); el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; el.style.color = s>D.punkte*60 ? "var(--red)" : ""; },1000);
      $(`#tcheck-${m}`).onclick = () => {
        stopClock();
        box.querySelectorAll(".cmp").forEach((c,i)=>{ c.hidden=false;
          c.innerHTML = `<div class="box"><h3>Deine Ausarbeitung</h3><p>${esc(t.texts[t.points[i]]||"(leer)")}</p></div><label class="check"><input type="checkbox" class="tok"><span class="tick" aria-hidden="true">✓</span><span>Kern dieses Punktes getroffen</span></label>`; });
        $(`#tcheck-${m}`).remove();
        $(`#tres-${m}`).innerHTML = `<button class="btn" id="tsave-${m}" style="margin-top:12px">Ergebnis speichern</button>`;
        $(`#tsave-${m}`).onclick = () => { const all=box.querySelectorAll(".tok"), ok=box.querySelectorAll(".tok:checked").length; const pc=Math.round(ok/all.length*100);
          const tt=tget(m); tt.hist.push({d:todayStr(), p:pc}); tsave(m,{hist:tt.hist, points:tt.points, texts:tt.texts}, true); TMODE[m]="view"; viewTransfer(); toast(`Gespeichert: ${pc} % der Punkte getroffen.`); };
      };
    }
  }
}

/* ---------- Fragenkatalog (Lastenheft E2, C3: Belege hier sichtbar) ---------- */
let CAT = {modul:"ALL", status:"ALL", q:""};
function stateLabel(it){
  if(it.status==="X") return "ausgeschlossen";
  if(it.offen) return "ohne Antwort";
  const p = prog(it.id);
  if(!p) return "neu";
  if(isDue(it)) return `Fach ${p.f}, fällig`;
  return `Fach ${p.f}, ${fmtDate(p.due).slice(0,6)}`;
}
function viewCatalog(){

    <input type="search" id="q" placeholder="Suchen" value="${esc(CAT.q)}" aria-label="Fragen durchsuchen">

      ${stBadge(i.status)}<span>${esc(i.frage)}</span><span class="s">${esc(stateLabel(i))}</span>
      <span class="why">${esc(i.id)} · ${esc(i.thema)}${i.punkte?` · ${num(i.punkte)} P.`:""}${i.beleg?` · Beleg: ${esc(i.beleg)}`:""}${i.hinweis?` · Dozent: ${esc(i.hinweis)}`:""}</span></div>`).join("")}</div>`;
  main.querySelectorAll(".chip").forEach(c => c.onclick = () => { CAT[c.dataset.k]=c.dataset.v; viewCatalog(); });
  const q=$("#q"); q.oninput = () => { CAT.q=q.value; const pos=q.selectionStart; viewCatalog(); const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos); };
  main.querySelectorAll(".li").forEach(li => {
    const open = () => { const it=ITEMS.find(i=>i.id===li.dataset.id); if(!trainable(it)){ toast(it.offen ? "Für diese Frage gibt es noch keine Musterantwort." : "Diese Frage ist ausgeschlossen oder überholt."); return; } VIEW="train"; render({single:it.id}); window.scrollTo(0,0); };
    li.onclick = open; li.onkeydown = e => { if(e.key==="Enter") open(); };
  });
}

/* ---------- Lernstatistik und Veränderungen (Lastenheft E2) ---------- */
function viewStats(){
  if(!ITEMS.length) return needsContent();
  if(DIFF && !DIFF.gesehen){ DIFF.gesehen = true; lsSet("diff", DIFF); }
  const t = dayNum(todayStr()), days = [...Array(14)].map((_,i)=>numDay(t-13+i));
  const cnt = {}; days.forEach(d=>cnt[d]={r:0,t:0,f:0});
  Object.values(PROG).forEach(p => (p.hist||[]).forEach(h => { if(cnt[h.d]) cnt[h.d][h.g]++; }));
  const maxN = Math.max(1, ...days.map(d=>cnt[d].r+cnt[d].t+cnt[d].f));
  const tot = days.reduce((a,d)=>({r:a.r+cnt[d].r, t:a.t+cnt[d].t, f:a.f+cnt[d].f}), {r:0,t:0,f:0}), sum = tot.r+tot.t+tot.f;
  let html = `<h1>Lernstatistik</h1>
    <div class="card"><h3>Letzte 14 Tage</h3><p class="small muted">${sum} Bewertungen: ${tot.r} richtig, ${tot.t} teilweise, ${tot.f} falsch${sum?` (${Math.round(tot.r/sum*100)} % richtig)`:""}</p>
      <div class="bars" role="img" aria-label="Bewertungen pro Tag">${days.map(d=>{ const c=cnt[d], h=v=>Math.round(v/maxN*100); return `<div title="${fmtDate(d)}: ${c.r} richtig, ${c.t} teilweise, ${c.f} falsch"><i style="height:${h(c.f)}%;background:var(--p1)"></i><i style="height:${h(c.t)}%;background:var(--p3)"></i><i style="height:${h(c.r)}%;background:var(--p5)"></i></div>`; }).join("")}</div>
      <div class="bl mono">${days.map(d=>`<span>${d.slice(8)}</span>`).join("")}</div>
      <div class="facts"><span><i class="dot" style="--mc:var(--p5)"></i> richtig</span><span><i class="dot" style="--mc:var(--p3)"></i> teilweise</span><span><i class="dot" style="--mc:var(--p1)"></i> falsch</span></div></div>
    <table class="t"><tr><th>Modul</th><th>Fach 1–6</th><th>Frei&shy;geschaltet</th><th>Neu</th><th>Lücken</th><th>Simulation</th></tr>
    ${modOrder().map(m=>{ const s=moduleStats(m), sim=SIMS.filter(x=>x.modul===m).at(-1);
      return `<tr><td>${m}</td><td class="mono">${s.fach.join(" · ")}</td><td class="mono">${s.unl.length} von ${s.scope.length}</td><td class="mono">${s.fresh.length}</td><td class="mono">${s.gaps.length}</td><td class="mono">${sim?`${Math.round(sim.punkte/sim.max*100)} % (${fmtDate(sim.d).slice(0,6)})`:"–"}</td></tr>`; }).join("")}</table>`;
  if(DIFF){
    const name = id => { const i = ITEMS.find(x=>x.id===id); return i ? `${esc(id)}: ${esc(i.frage)}` : esc(id); };
    html += `<h2>Veränderungen im letzten Inhaltspaket (${fmtDT(DIFF.at)})</h2>
      ${DIFF.neu.length?`<h3>Neu (${DIFF.neu.length})</h3><ul class="small">${DIFF.neu.map(id=>`<li>${name(id)}</li>`).join("")}</ul>`:""}
      ${DIFF.geaendert.length?`<h3>Geändert (${DIFF.geaendert.length})</h3><ul class="small">${DIFF.geaendert.map(id=>`<li>${name(id)}</li>`).join("")}</ul>`:""}`;
  }
  main.innerHTML = html;
}

/* ---------- Daten und Einrichtung ---------- */
function viewData(){
  const setupLink = LOCAL.cid ? `${location.origin}${location.pathname}#cid=${encodeURIComponent(LOCAL.cid)}` : "";
  const st = s => `<button class="chip" data-st="${s}" aria-pressed="${SET.statuses.includes(s)}">${s} ${STATUS[s].label}</button>`;
  main.innerHTML = `<h1>Daten und Einstellungen</h1>
    <h2>Google Drive</h2>
    <div class="card">
      ${hasToken()?`<p>Angemeldet${LOCAL.email?` als <b>${esc(LOCAL.email)}</b>`:""}. Letzter Abgleich: ${LOCAL.lastSync?fmtDT(LOCAL.lastSync):"–"}.</p>
        <div class="row"><button class="btn" id="syncBtn">Jetzt abgleichen</button><button class="btn ghost" id="logoutBtn">Abmelden</button></div>`
      : LOCAL.cid ? `<p>Nicht angemeldet.${pending()?" Es gibt Änderungen, die noch nicht in Drive sind.":""}</p><button class="btn" id="loginBtn">Mit Google anmelden</button>` : `<p>Noch nicht eingerichtet.</p>`}
      <p class="hint" style="margin-top:10px">Die App sieht in deinem Drive nur ihren eigenen Ordner ${FOLDER_NAME} (Lernstand, Inhaltspaket, Sicherungen). Auf alle anderen Dateien hat sie keinen Zugriff.</p>
      <details ${LOCAL.cid?"":"open"}><summary>Client-ID ${LOCAL.cid?"ändern":"eintragen"}</summary>
        <label class="field"><span>Client-ID aus der Google Cloud Console (endet auf .apps.googleusercontent.com)</span><input type="text" id="cid" value="${esc(LOCAL.cid)}" autocomplete="off" spellcheck="false"></label>
        <button class="btn small" id="cidSave">Speichern</button></details>
    </div>
    ${LOCAL.cid?`<h2>Handy einrichten</h2><div class="card">
      <p class="small">Diesen Link auf dem Handy in Chrome öffnen. Er trägt die Client-ID ein, danach nur noch „Mit Google anmelden“.</p>
      <input type="text" readonly value="${esc(setupLink)}" id="setupLink" style="font-size:.8rem">
      <div class="row" style="margin-top:8px"><button class="btn small" id="copyLink">Link kopieren</button></div>
      <p class="hint" style="margin-top:8px">Am bequemsten: in Brave in der Adresszeile auf „Teilen“ bzw. das QR-Symbol klicken, nachdem du den Link geöffnet hast, und den QR-Code mit der Handykamera scannen. Oder den Link per Mail oder Notiz an dich selbst schicken. Auf dem Handy dann im Chrome-Menü „Zum Startbildschirm hinzufügen“ bzw. „App installieren“.</p></div>`:""}
    <h2>Inhalte</h2>
    <div class="card">
      ${PKG?`<table class="t"><tr><th>Stand</th><td>${fmtDT(PKG.erstellt)}, erstellt am ${esc(PKG.geraet||"PC")} aus ${esc(PKG.quelle||"–")}</td></tr>
        <tr><th>Umfang</th><td>${ITEMS.length} Fragen: ${BUILD.cards} Karteikarten, ${BUILD.meta} Einträge der Prüfungsebene, ${Object.keys(PKG.bilder||{}).length} Bilder</td></tr>
        <tr><th>Dateien</th><td class="small">${BUILD.files.map(esc).join("<br>")}</td></tr></table>
        ${BUILD.warnings.length?`<details><summary>${BUILD.warnings.length} Hinweise zu den Dateien</summary><ul class="small">${BUILD.warnings.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></details>`:`<p class="small muted">Keine Auffälligkeiten.</p>`}`
        :`<p>Noch kein Inhaltspaket geladen.</p>`}
      ${DEVICE==="PC"?`<p class="hint" style="margin-top:10px">Nach jeder Nachbereitung im Modulchat: „Inhalte nach Drive“, dann den Ordner Studium bzw. Studium_Cloudkopie wählen. Gelesen werden nur karten.csv, Pruefung/pruefung_Mx.csv und die dort genannten Bilder. Das Handy holt sich das neue Paket beim nächsten Abgleich.</p>
        <button class="btn" id="pushBtn">Inhalte nach Drive</button>`:`<p class="hint" style="margin-top:10px">Neue Inhalte erstellst du am PC. Das Handy lädt sie beim Abgleich automatisch.</p>`}
    </div>
    <h2>Sicherungen in Drive</h2>
    <div class="card"><p class="hint">Nach jeder Lerneinheit legt die App eine Sicherung in ${FOLDER_NAME}/Sicherungen ab. Die letzten 10 bleiben erhalten.</p>
      <button class="btn small ghost" id="bkList" ${hasToken()?"":"disabled"}>Sicherungen anzeigen</button><div id="bk"></div>
      <div class="row" style="margin-top:10px"><button class="btn link" id="expBtn">Lernstand als Datei herunterladen</button></div></div>
    <h2>Training</h2>
    <p class="small muted">Welche Stufen trainiert werden (Standard A und B, C nur als Zusatz, X nie)</p><div class="chips">${["A","B","C","?"].map(st).join("")}</div>
    <h2>Klausurtermine</h2>
    <p class="hint">Die letzte Wiederholung liegt spätestens zwei Tage vor der Klausur. Bei Terminänderung hier anpassen.</p>
    ${Object.keys(MODULES).sort().map(m=>`<label class="field" style="max-width:280px"><span>${m} ${esc(MODULES[m].short)}</span><input type="date" data-exam="${m}" value="${examOf(m)}"></label>`).join("")}
    <p class="small muted" style="margin-top:24px">Version ${VERSION} · Gerät: ${DEVICE}</p>`;
  const on = (id, fn) => { const el=$("#"+id); if(el) el.onclick=fn; };
  on("syncBtn", () => syncNow({unit:true})); on("logoutBtn", () => { logout(); viewData(); }); on("loginBtn", login);
  on("cidSave", () => { const v=$("#cid").value.trim(); if(v && !/\.apps\.googleusercontent\.com$/.test(v)){ toast("Das sieht nicht wie eine Client-ID aus (Endung .apps.googleusercontent.com)."); return; } LOCAL.cid=v; G.client=null; persistLocal(); toast("Gespeichert."); viewData(); renderSync(); });
  on("copyLink", async () => toast(await copyText(setupLink) ? "Link kopiert." : "Kopieren nicht möglich, Link markieren und kopieren."));
  on("pushBtn", pushContent);
  on("expBtn", () => download(`lernstand_${todayStr()}.json`, JSON.stringify(stateObj())));
  on("bkList", async () => {
    const box = $("#bk"); box.innerHTML = `<p class="small muted">Lade …</p>`;
    try{
      const list = await listBackups();
      box.innerHTML = list.length ? `<table class="t" style="margin-top:8px">${list.map(f=>`<tr><td>${fmtDT(f.createdTime)}</td><td class="small">${esc(f.name.replace(/^lernstand_|\.json$/g,""))}</td><td><button class="btn link" data-bk="${f.id}">Übernehmen</button></td></tr>`).join("")}</table>` : `<p class="small muted">Noch keine Sicherung.</p>`;
      box.querySelectorAll("[data-bk]").forEach(b => b.onclick = async () => {
        if(!confirm("Diesen gesicherten Stand übernehmen? Alles, was du danach gelernt hast, wird durch die Sicherung ersetzt, auch auf dem anderen Gerät.")) return;
        try{
          const d = await readJSON(b.dataset.bk), now = Date.now();
          PROG = d.prog || {}; Object.values(PROG).forEach(p => p.upd = now);
          TRANS = d.transfer || {}; Object.values(TRANS).forEach(t => t.upd = now);
          SIMS = d.sims || []; if(d.settings){ SET = Object.assign({statuses:["A","B"], exams:{}}, d.settings, {upd:now}); }
          LOCAL.ids.lernstand && await writeJSON(LOCAL.ids.lernstand, "lernstand.json", null, stateObj());
          changed(); toast("Sicherung übernommen."); go("home");
        }catch(e){ toast("Übernehmen fehlgeschlagen: " + e.message); }
      });
    }catch(e){ box.innerHTML = `<p class="small">Nicht möglich: ${esc(e.message)}</p>`; }
  });
  main.querySelectorAll("[data-st]").forEach(c => c.onclick = () => { const s=c.dataset.st; SET.statuses = SET.statuses.includes(s) ? SET.statuses.filter(x=>x!==s) : SET.statuses.concat(s); if(!SET.statuses.length) SET.statuses=["A"]; SET.upd=Date.now(); changed(); viewData(); });
  main.querySelectorAll("[data-exam]").forEach(i => i.onchange = () => { if(!i.value) return; SET.exams[i.dataset.exam] = i.value; SET.upd=Date.now(); changed(); toast("Termin gespeichert."); });
}

/* ============================================================
   Start
   ============================================================ */
applyTheme();
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="hidden" && pending() && hasToken()) syncNow({unit:true}); else if(document.visibilityState==="visible" && hasToken()) scheduleSync(300); });
window.addEventListener("online", () => { if(hasToken()) scheduleSync(300); });
setInterval(() => { if(document.visibilityState==="visible" && hasToken() && !SESSION && !SIMRUN) syncNow(); }, 5*60e3);
if(location.protocol.startsWith("http") && "serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
(async () => {
  const pkg = await idbGet("pkg");
  if(pkg){ applyPackage(pkg, pkg.erstellt !== LOCAL.pkgErstellt); }
  render();
  if(hasToken()) syncNow({first:true}); else renderSync();
})();
window.KT = {buildItems, rate, mergeIn, get items(){return ITEMS;}, get prog(){return PROG;}, get local(){return LOCAL;}, syncNow, applyPackage};
</script>
